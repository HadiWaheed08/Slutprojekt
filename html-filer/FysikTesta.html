<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css-filer/style.css" />
    <script src="../JavaScript/JavaScript.js"></script>
    <title>Fysik-Kunskap</title>
  </head>

  <body class="FysikTesta">
    <header>
      <nav>
        <section class="Navigation">
          <!-- Navigation, den vägleder användaren till andra webbsidor-->
          <ul>
            <li>
              <a href="../html-filer/Index.html"><button>Hem</button></a>
            </li>
            <li>
              <a href="../html-filer/Fysiklär.html"
                ><button>Lär dig fysik</button></a
              >
            </li>
            <li>
              <a href="../html-filer/FysikTesta.html"
                ><button>Testa dig på Fysik</button></a
              >
            </li>
            <li><button id="SignInBtn">Logga in</button></li>
            <li><button id="SignUpBtn">Registrera</button></li>
          </ul>
        </section>
      </nav>
      <div class="FysikTestaContainer">
        <h1>Fysik Quiz</h1>
        <div id="quiz">
          <div id="frågor"></div>
          <div id="val"></div>
          <button id="nextBtn">Nästa</button>
        </div>
        <div id="resultat" class="hidden"></div>
        <button id="StartaOmBtn" class="hidden">Starta om Quiz</button>
        <div id="timer">Tid kvar: <span id="tid">30</span>s</div>
      </div>
    </header>
    <div class="FormBox">
      <!-- Panelen för att registrera sig -->
      <form id="SignupForm" style="display: none">
        <label for="username">Username:</label>
        <input type="text" id="regusername" name="username" />
        <br />
        <label for="password">Password:</label>
        <input type="password" id="regpassword" name="password" />
        <br />
        <label for="conpassword">Confirm Password:</label>
        <input type="password" id="regconpassword" name="conpassword" />
        <br />
        <input type="submit" value="Registrera" />
      </form>
    </div>
    <div class="FormBox">
      <!-- Panelen för att logga in -->
      <form id="LoginForm" style="display: none">
        <label for="username">Username:</label>
        <input type="text" id="logusername" name="username" />
        <br />
        <label for="password">Password:</label>
        <input type="password" id="logpassword" name="password" />
        <br />
        <input type="submit" value="Submit" />
      </form>
    </div>

    <footer class="Footer">
      <p>&copy; Fysik-Kunskap</p>
    </footer>
  </body>
</html>
