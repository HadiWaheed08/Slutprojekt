    <header>
      <nav>

      <h1>Fysik Quiz</h1>
      <div class="FysikTestaContainer">
        <div class="box3">
          <div id="quiz">
            <div id="frågor"></div>
            <div id="val"></div>
            <button id="nextBtn">Nästa</button>
          </div>
          <div id="svar" class="hidden"></div>
          <button id="StartaOmBtn" class="hidden">Starta om Quiz</button>
          <div id="timer">sekunder kvar: <span id="tid">30</span>s</div>
        </div>
      </div>
    </header>
    <div class="feedback-box">
  <h2>Feedback</h2>

  <form id="feedbackForm">
    <input type="text" id="username" placeholder="Namn" required>

    <textarea id="message" placeholder="Skriv här..." required></textarea>

    <button type="submit">Skicka</button>
  </form>
<!-- Gjorde en feedback system -->
  <div id="feedbackResult"></div>
</div>
